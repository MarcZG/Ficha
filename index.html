<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FichajeApp</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    @keyframes spin  { to { transform: rotate(360deg); } }
    @keyframes fadein { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }

    body { font-family: 'IBM Plex Mono', monospace; background: #0a0f1e; color: #f1f5f9; min-height: 100vh; }

    /* HEADER */
    header { background: #0d1526; border-bottom: 1px solid #1e293b; padding: 18px 20px 0; position: sticky; top:0; z-index:10; }
    .header-inner { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px; }
    .logo { font-size:20px; font-weight:700; color:#38bdf8; letter-spacing:-0.5px; }
    .sub  { font-size:11px; color:#475569; margin-top:3px; }
    .pill { font-size:11px; padding:4px 10px; border-radius:20px; border:1px solid; display:inline-block; }
    .pill-green  { background:#22c55e22; color:#22c55e; border-color:#22c55e44; }
    .pill-yellow { background:#f59e0b22; color:#f59e0b; border-color:#f59e0b44; }
    .pill-red    { background:#ef444422; color:#ef4444; border-color:#ef444444; }

    /* TABS */
    .tabs { display:flex; gap:2px; }
    .tab-btn {
      padding:9px 16px; border:none; cursor:pointer; font-family:inherit; font-size:12px;
      background:transparent; color:#475569; border-bottom:2px solid transparent; transition:all .2s;
    }
    .tab-btn.active { background:#38bdf815; color:#38bdf8; border-bottom:2px solid #38bdf8; }

    /* MAIN */
    main { padding:20px; max-width:900px; margin:0 auto; }

    /* GRID FICHAJE */
    .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); gap:14px; }
    .card {
      background:#0d1526; border:1px solid #1e293b; border-radius:12px; padding:18px;
      display:flex; flex-direction:column; gap:10px; transition:background .4s, border .4s, box-shadow .4s;
      animation: fadein .3s ease;
    }
    .card.checked  { border-color:#166534; box-shadow:0 0 18px #16a34a28; }
    .card.flashing { animation: fadein .1s; }
    .avatar {
      width:48px; height:48px; border-radius:10px; background:#1e293b; color:#64748b;
      display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:700;
    }
    .avatar.checked { background:#166534; color:#4ade80; }
    .card-name   { font-weight:700; font-size:15px; margin-bottom:2px; }
    .card-role   { color:#64748b; font-size:11px; margin-bottom:7px; }
    .card-status { font-size:12px; font-weight:600; margin-bottom:3px; }
    .card-status.in  { color:#4ade80; }
    .card-status.out { color:#f87171; }
    .card-last   { font-size:10px; color:#475569; }
    .ficha-btn {
      padding:9px 0; border-radius:7px; border:none; cursor:pointer;
      font-weight:700; font-size:12px; font-family:inherit; color:#fff; transition:opacity .2s;
    }
    .ficha-btn:disabled { opacity:.5; cursor:not-allowed; }
    .ficha-btn.entrada { background:#16a34a; }
    .ficha-btn.salida  { background:#dc2626; }

    /* HISTORIAL */
    .section-title { font-size:12px; font-weight:700; color:#38bdf8; margin-bottom:14px; letter-spacing:1.5px; text-transform:uppercase; }
    .empty { color:#475569; font-size:13px; padding:16px 0; }
    .table { background:#0d1526; border:1px solid #1e293b; border-radius:10px; overflow:hidden; margin-bottom:8px; }
    .table-head { display:grid; grid-template-columns:1fr 120px 155px; padding:8px 14px; background:#0a0f1e; font-size:10px; color:#475569; letter-spacing:1.2px; text-transform:uppercase; }
    .table-row  { display:grid; grid-template-columns:1fr 120px 155px; padding:11px 14px; font-size:12px; border-top:1px solid #1e293b; align-items:center; }
    .type-badge { font-size:11px; padding:2px 8px; border-radius:5px; display:inline-block; }
    .type-badge.entrada { background:#16a34a30; color:#4ade80; }
    .type-badge.salida  { background:#dc262630; color:#f87171; }

    /* EMPLEADOS */
    .emp-list { display:flex; flex-direction:column; gap:9px; }
    .emp-row  { display:flex; gap:8px; align-items:center; flex-wrap:wrap; background:#0d1526; border:1px solid #1e293b; border-radius:9px; padding:12px 14px; }
    .emp-name { font-weight:700; color:#f1f5f9; }
    .emp-role { color:#64748b; font-size:12px; }
    .emp-info { flex:1; }
    input {
      flex:1; min-width:130px; background:#0a0f1e; border:1px solid #334155; border-radius:6px;
      padding:7px 11px; color:#f1f5f9; font-family:inherit; font-size:12px; outline:none;
    }
    .btn { padding:6px 13px; border-radius:6px; cursor:pointer; font-family:inherit; font-size:11px; }
    .btn-edit   { border:1px solid #334155; background:transparent; color:#94a3b8; }
    .btn-del    { border:1px solid #7f1d1d;  background:transparent; color:#f87171; }
    .btn-save   { border:none; background:#16a34a; color:#fff; font-weight:700; }
    .btn-cancel { border:1px solid #334155; background:transparent; color:#64748b; }
    .btn-new    { width:100%; padding:11px 0; border-radius:8px; border:1px dashed #334155; background:transparent; color:#38bdf8; cursor:pointer; font-family:inherit; font-size:12px; font-weight:700; }

    /* LOADING */
    #loading { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; }
    .spinner { width:38px; height:38px; border:3px solid #1e293b; border-top:3px solid #38bdf8; border-radius:50%; animation:spin 1s linear infinite; }

    /* HIDDEN */
    .hidden { display:none !important; }
  </style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <p style="color:#94a3b8;margin-top:16px;font-size:13px;">Conectando con JSONBin…</p>
</div>

<div id="app" class="hidden">
  <header>
    <div class="header-inner">
      <div>
        <div class="logo">⏱ FichajeApp</div>
        <div class="sub" id="sub-date"></div>
      </div>
      <div id="status-pill"></div>
    </div>
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('fichaje')">🏢 Fichaje</button>
      <button class="tab-btn"       onclick="switchTab('historial')">📋 Historial</button>
      <button class="tab-btn"       onclick="switchTab('empleados')">👥 Empleados</button>
    </div>
  </header>

  <main>
    <div id="tab-fichaje">
      <div class="grid" id="grid"></div>
    </div>

    <div id="tab-historial" class="hidden">
      <div class="section-title" id="hist-today-title"></div>
      <div id="hist-today"></div>
      <div style="margin-top:28px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
          <div class="section-title" style="margin-bottom:0" id="hist-all-title"></div>
          <div style="display:flex;gap:8px;">
            <button class="btn btn-edit" onclick="exportCSV()" style="border-color:#334155;color:#38bdf8;">⬇ CSV</button>
            <button class="btn btn-edit" onclick="exportPDF()" style="border-color:#334155;color:#a78bfa;">⬇ PDF</button>
          </div>
        </div>
        <div id="hist-all"></div>
      </div>
    </div>

    <div id="tab-empleados" class="hidden">
      <div class="section-title">Gestión de empleados</div>
      <div class="emp-list" id="emp-list"></div>
    </div>
  </main>
</div>

<script>
  // ── CONFIG ──────────────────────────────
  const MASTER_KEY   = '$2a$10$gUeQiPb9CQCq7v6YkpvY2.oqYi2in6qh3xRhWCei6ZagkcXzdjI9a';
  const BIN_ID       = '6a01b1d4adc21f119a830073';
  const POLL_MS      = 5000;
  const BASE_URL     = `https://api.jsonbin.io/v3/b/${BIN_ID}`;
  const HEADERS      = { 'Content-Type':'application/json', 'X-Master-Key': MASTER_KEY, 'X-Bin-Versioning':'false' };

  const DEFAULT_DATA = {
    employees: [
      { id:1, name:'Ana García',   role:'Diseñadora' },
      { id:2, name:'Carlos López', role:'Desarrollador' },
      { id:3, name:'Marta Ruiz',   role:'Product Manager' },
    ],
    records: []
  };

  // ── STATE ────────────────────────────────
  let db          = { employees:[], records:[] };
  let saving      = false;
  let currentTab  = 'fichaje';
  let editingId   = null;
  let addingNew   = false;
  let flashEmpId  = null;
  let pollTimer   = null;

  // ── UTILS ────────────────────────────────
  const fmt    = iso => new Date(iso).toLocaleString('es-ES',{dateStyle:'short',timeStyle:'short'});
  const today  = ()  => new Date().toLocaleDateString('es-ES');
  const nowISO = ()  => new Date().toISOString();
  const sanitize = raw => ({
    employees: Array.isArray(raw?.employees) ? raw.employees : DEFAULT_DATA.employees,
    records:   Array.isArray(raw?.records)   ? raw.records   : []
  });

  // ── JSONBIN ──────────────────────────────
  async function fetchData(isInit=false) {
    try {
      const res  = await fetch(`${BASE_URL}/latest`, { headers: HEADERS });
      if (!res.ok) throw new Error(`GET ${res.status}`);
      const json = await res.json();
      db = sanitize(json.record);
      setStatus('online');
    } catch(e) {
      if (isInit) {
        try {
          const res2 = await fetch(BASE_URL, { method:'PUT', headers:HEADERS, body:JSON.stringify(DEFAULT_DATA) });
          if (!res2.ok) throw new Error(`INIT ${res2.status}`);
          const j2 = await res2.json();
          db = sanitize(j2.record);
          setStatus('online');
        } catch(e2) {
          db = sanitize(DEFAULT_DATA);
          setStatus('error', 'Sin conexión');
        }
      } else {
        setStatus('error', 'Error sync');
      }
    }
    if (isInit) {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
    }
    render();
  }

  async function saveData(payload) {
    saving = true;
    setStatus('saving');
    render();
    try {
      const res  = await fetch(BASE_URL, { method:'PUT', headers:HEADERS, body:JSON.stringify(payload) });
      if (!res.ok) throw new Error(`PUT ${res.status}`);
      const json = await res.json();
      db = sanitize(json.record);
      setStatus('online');
    } catch(e) {
      setStatus('error', 'Error al guardar');
    }
    saving = false;
    render();
  }

  // ── STATUS ───────────────────────────────
  function setStatus(state, msg='') {
    const el = document.getElementById('status-pill');
    if (state === 'online')  el.innerHTML = '<span class="pill pill-green">● En línea</span>';
    if (state === 'saving')  el.innerHTML = '<span class="pill pill-yellow">Guardando…</span>';
    if (state === 'error')   el.innerHTML = `<span class="pill pill-red">⚠ ${msg}</span>`;
  }

  // ── TABS ─────────────────────────────────
  function switchTab(name) {
    currentTab = name;
    editingId  = null;
    addingNew  = false;
    document.querySelectorAll('.tab-btn').forEach((b,i) => {
      b.classList.toggle('active', ['fichaje','historial','empleados'][i] === name);
    });
    ['fichaje','historial','empleados'].forEach(t => {
      document.getElementById(`tab-${t}`).classList.toggle('hidden', t !== name);
    });
    render();
  }

  // ── FICHAJE LOGIC ────────────────────────
  function getLastRecord(empId) {
    return [...db.records]
      .filter(r => r.employeeId === empId)
      .sort((a,b) => new Date(b.timestamp)-new Date(a.timestamp))[0] ?? null;
  }
  function isCheckedIn(empId) { return getLastRecord(empId)?.type === 'entrada'; }

  async function fichar(empId) {
    if (saving) return;
    const emp  = db.employees.find(e => e.id === empId);
    const type = isCheckedIn(empId) ? 'salida' : 'entrada';
    const rec  = { id:Date.now(), employeeId:empId, employeeName:emp.name, type, timestamp:nowISO() };
    flashEmpId = empId;
    setTimeout(() => { flashEmpId=null; render(); }, 1200);
    await saveData({ ...db, records:[...db.records, rec] });
  }

  // ── EMPLEADOS CRUD ───────────────────────
  async function saveEmployee() {
    const nameEl = document.getElementById('edit-name');
    const roleEl = document.getElementById('edit-role');
    if (!nameEl.value.trim()) return;
    const updated = db.employees.map(e => e.id===editingId ? {...e, name:nameEl.value.trim(), role:roleEl.value.trim()} : e);
    editingId = null;
    await saveData({ ...db, employees:updated });
  }

  async function addEmployee() {
    const nameEl = document.getElementById('new-name');
    const roleEl = document.getElementById('new-role');
    if (!nameEl.value.trim()) return;
    const emp = { id:Date.now(), name:nameEl.value.trim(), role:roleEl.value.trim() };
    addingNew = false;
    await saveData({ ...db, employees:[...db.employees, emp] });
  }

  async function deleteEmployee(id) {
    if (!confirm('¿Eliminar este empleado?')) return;
    await saveData({
      ...db,
      employees: db.employees.filter(e => e.id!==id),
      records:   db.records.filter(r => r.employeeId!==id)
    });
  }

  // ── RENDER ───────────────────────────────
  function render() {
    document.getElementById('sub-date').textContent = `${today()} · sync cada ${POLL_MS/1000}s`;

    if (currentTab === 'fichaje')   renderFichaje();
    if (currentTab === 'historial') renderHistorial();
    if (currentTab === 'empleados') renderEmpleados();
  }

  function renderFichaje() {
    const grid = document.getElementById('grid');
    grid.innerHTML = db.employees.map(emp => {
      const checked  = isCheckedIn(emp.id);
      const last     = getLastRecord(emp.id);
      const isFlash  = flashEmpId === emp.id;
      const initials = emp.name.split(' ').map(n=>n[0]).join('').slice(0,2).toUpperCase();
      return `
        <div class="card ${checked?'checked':''}" style="${isFlash?'animation:fadein .1s':''}">
          <div class="avatar ${checked?'checked':''}">${initials}</div>
          <div>
            <div class="card-name">${emp.name}</div>
            <div class="card-role">${emp.role}</div>
            <div class="card-status ${checked?'in':'out'}">${checked?'✅ Dentro':'🔴 Fuera'}</div>
            ${last ? `<div class="card-last">Último: ${last.type} · ${fmt(last.timestamp)}</div>` : ''}
          </div>
          <button class="ficha-btn ${checked?'salida':'entrada'}"
            onclick="fichar(${emp.id})" ${saving?'disabled':''}>
            ${checked?'Registrar salida':'Registrar entrada'}
          </button>
        </div>`;
    }).join('');
  }

  function renderHistorial() {
    const todayRecs = [...db.records]
      .filter(r => new Date(r.timestamp).toLocaleDateString('es-ES')===today())
      .sort((a,b) => new Date(b.timestamp)-new Date(a.timestamp));
    const allRecs = [...db.records].sort((a,b) => new Date(b.timestamp)-new Date(a.timestamp));

    document.getElementById('hist-today-title').textContent = `Hoy — ${todayRecs.length} fichajes`;
    document.getElementById('hist-all-title').textContent   = `Historial completo — ${allRecs.length} registros`;
    document.getElementById('hist-today').innerHTML = todayRecs.length ? tableHTML(todayRecs) : '<div class="empty">No hay fichajes hoy todavía.</div>';
    document.getElementById('hist-all').innerHTML   = allRecs.length   ? tableHTML(allRecs)   : '<div class="empty">Sin registros.</div>';
  }

  function tableHTML(rows) {
    return `<div class="table">
      <div class="table-head"><span>Empleado</span><span>Tipo</span><span>Fecha</span></div>
      ${rows.map(r=>`
        <div class="table-row">
          <span style="font-weight:600">${r.employeeName}</span>
          <span class="type-badge ${r.type}">${r.type==='entrada'?'🟢 Entrada':'🔴 Salida'}</span>
          <span style="color:#64748b;font-size:11px">${fmt(r.timestamp)}</span>
        </div>`).join('')}
    </div>`;
  }

  function renderEmpleados() {
    const list = document.getElementById('emp-list');
    const rows = db.employees.map(emp => {
      if (editingId === emp.id) {
        return `<div class="emp-row">
          <input id="edit-name" value="${emp.name}" placeholder="Nombre" />
          <input id="edit-role" value="${emp.role}" placeholder="Puesto" />
          <button class="btn btn-save"   onclick="saveEmployee()">Guardar</button>
          <button class="btn btn-cancel" onclick="editingId=null;render()">Cancelar</button>
        </div>`;
      }
      return `<div class="emp-row">
        <div class="emp-info">
          <div class="emp-name">${emp.name}</div>
          <div class="emp-role">${emp.role}</div>
        </div>
        <button class="btn btn-edit" onclick="editingId=${emp.id};render()">Editar</button>
        <button class="btn btn-del"  onclick="deleteEmployee(${emp.id})">Eliminar</button>
      </div>`;
    }).join('');

    const addRow = addingNew
      ? `<div class="emp-row">
          <input id="new-name" placeholder="Nombre del empleado" />
          <input id="new-role" placeholder="Puesto" />
          <button class="btn btn-save"   onclick="addEmployee()">Añadir</button>
          <button class="btn btn-cancel" onclick="addingNew=false;render()">Cancelar</button>
        </div>`
      : `<button class="btn-new" onclick="addingNew=true;render()">+ Añadir empleado</button>`;

    list.innerHTML = rows + addRow;
  }

  // ── EXPORT ──────────────────────────────
  function sortedRecords() {
    return [...db.records].sort((a,b) => new Date(b.timestamp)-new Date(a.timestamp));
  }

  function exportCSV() {
    const rows = sortedRecords();
    if (!rows.length) { alert('No hay registros para exportar.'); return; }
    const header = 'Empleado,Tipo,Fecha,Hora\n';
    const body = rows.map(r => {
      const d = new Date(r.timestamp);
      const fecha = d.toLocaleDateString('es-ES');
      const hora  = d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
      return `"${r.employeeName}","${r.type}","${fecha}","${hora}"`;
    }).join('\n');
    const blob = new Blob(['\uFEFF'+header+body], {type:'text/csv;charset=utf-8;'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `fichajes_${new Date().toLocaleDateString('es-ES').replace(/\//g,'-')}.csv`;
    a.click();
  }

  function exportPDF() {
    const rows = sortedRecords();
    if (!rows.length) { alert('No hay registros para exportar.'); return; }
    const win = window.open('','_blank');
    const tableRows = rows.map(r => {
      const d = new Date(r.timestamp);
      const fecha = d.toLocaleDateString('es-ES');
      const hora  = d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
      const color = r.type==='entrada'?'#166534':'#7f1d1d';
      const bg    = r.type==='entrada'?'#f0fdf4':'#fef2f2';
      return `<tr>
        <td>${r.employeeName}</td>
        <td><span style="background:${bg};color:${color};padding:2px 8px;border-radius:4px;font-size:11px;">${r.type==='entrada'?'🟢 Entrada':'🔴 Salida'}</span></td>
        <td>${fecha}</td>
        <td>${hora}</td>
      </tr>`;
    }).join('');
    win.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Historial de Fichajes</title>
    <style>
      body{font-family:Arial,sans-serif;padding:32px;color:#1e293b;}
      h1{font-size:22px;margin-bottom:4px;}
      p{color:#64748b;font-size:13px;margin-bottom:24px;}
      table{width:100%;border-collapse:collapse;font-size:13px;}
      th{background:#0f172a;color:#f1f5f9;padding:10px 12px;text-align:left;}
      td{padding:9px 12px;border-bottom:1px solid #e2e8f0;}
      tr:nth-child(even) td{background:#f8fafc;}
      @media print{button{display:none!important;}}
    </style></head><body>
    <h1>⏱ Historial de Fichajes</h1>
    <p>Generado el ${new Date().toLocaleDateString('es-ES')} · ${rows.length} registros</p>
    <table>
      <thead><tr><th>Empleado</th><th>Tipo</th><th>Fecha</th><th>Hora</th></tr></thead>
      <tbody>${tableRows}</tbody>
    </table>
    <br>
    <button onclick="window.print()" style="padding:10px 20px;background:#0f172a;color:white;border:none;border-radius:6px;cursor:pointer;font-size:14px;">🖨 Imprimir / Guardar PDF</button>
    </body></html>`);
    win.document.close();
  }

  // ── INIT ─────────────────────────────────
  fetchData(true);
  pollTimer = setInterval(() => fetchData(false), POLL_MS);
</script>
</body>
</html>
